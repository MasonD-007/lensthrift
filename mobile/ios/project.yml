name: LensThrift
options:
  bundleIdPrefix: com.lensthrift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.5

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your own team to run on a physical iPhone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  LensThrift:
    type: application
    platform: iOS
    sources:
      - LensThrift
    dependencies:
      - package: HaishinKit
        product: HaishinKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lensthrift.mobile
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thrift Lens
        INFOPLIST_KEY_NSCameraUsageDescription: Thrift Lens uses the camera to capture items for pricing.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
